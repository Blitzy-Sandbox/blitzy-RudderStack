maxProcess: 12
enableProcessor: true
enableRouter: true
enableStats: true
statsTagsFormat: influxdb
HttpClient:
  timeout: 30s
Http:
  ReadTimeout: 0s
  ReadHeaderTimeout: 0s
  WriteTimeout: 10s
  IdleTimeout: 720s
  MaxHeaderBytes: 524288
RateLimit:
  eventLimit: 1000
  rateLimitWindow: 60m
  noOfBucketsInWindow: 12
Gateway:
  webPort: 8080
  maxUserWebRequestWorkerProcess: 64
  maxDBWriterProcess: 256
  CustomVal: GW
  maxUserRequestBatchSize: 128
  maxDBBatchSize: 128
  userWebRequestBatchTimeout: 15ms
  dbBatchWriteTimeout: 5ms
  maxReqSizeInKB: 4000
  enableRateLimit: false
  enableSuppressUserFeature: true
  allowPartialWriteWithErrors: true
  allowReqsWithoutUserIDAndAnonymousID: false
  webhook:
    batchTimeout: 20ms
    maxBatchSize: 32
    maxTransformerProcess: 64
    maxRetry: 5
    maxRetryTime: 10s
    sourceListForParsingParams:
      - shopify
      - adjust
EventSchemas:
  enableEventSchemasFeature: false
  syncInterval: 240s
  noOfWorkers: 128
Debugger:
  maxBatchSize: 32
  maxESQueueSize: 1024
  maxRetry: 3
  batchTimeout: 2s
  retrySleep: 100ms
LiveEvent:
  cache:
    size: 3
    ttl: 20d
    clearFreq: 5s
SourceDebugger:
  disableEventUploads: false
DestinationDebugger:
  disableEventDeliveryStatusUploads: false
TransformationDebugger:
  disableTransformationStatusUploads: false
Archiver:
  backupRowsBatchSize: 100
JobsDB:
  jobDoneMigrateThres: 0.8
  jobStatusMigrateThres: 5
  maxDSSize: 100000
  maxMigrateOnce: 10
  maxMigrateDSProbe: 10
  maxTableSizeInMB: 300
  migrateDSLoopSleepDuration: 30s
  addNewDSLoopSleepDuration: 5s
  refreshDSListLoopSleepDuration: 5s
  backupCheckSleepDuration: 5s
  backupRowsBatchSize: 1000
  archivalTimeInDays: 10
  archiverTickerTime: 1440m
  backup:
    enabled: true
    gw:
      enabled: true
      pathPrefix: ""
    rt:
      enabled: true
      failedOnly: true
    batch_rt:
      enabled: false
      failedOnly: false
  gw:
    enableWriterQueue: false
    maxOpenConnections: 64
Router:
  jobQueryBatchSize: 10000
  updateStatusBatchSize: 1000
  readSleep: 1000ms
  fixedLoopSleep: 0ms
  noOfJobsPerChannel: 1000
  noOfJobsToBatchInAWorker: 20
  jobsBatchTimeout: 5s
  maxSleep: 60s
  minSleep: 0s
  maxStatusUpdateWait: 5s
  useTestSink: false
  guaranteeUserEventOrder: true
  kafkaWriteTimeout: 2s
  kafkaDialTimeout: 10s
  minRetryBackoff: 10s
  maxRetryBackoff: 300s
  noOfWorkers: 64
  allowAbortedUserJobsCountForProcessing: 1
  maxFailedCountForJob: 3
  retryTimeWindow: 180m
  failedKeysEnabled: true
  saveDestinationResponseOverride: false
  transformerProxy: false
  transformerProxyRetryCount: 15
  GOOGLESHEETS:
    noOfWorkers: 1
  MARKETO:
    noOfWorkers: 4
  throttler:
    algorithm: gcra
#    redis:
#      addr: localhost:6379
#      username: ""
#      password: ""
    MARKETO:
      limit: 45
      timeWindow: 20s
# throttling by destinationID example below
#      xxxyyyzzSOU9pLRavMf0GuVnWV3:
#        limit: 90
#        timeWindow: 10s
  BRAZE:
    forceHTTP1: true
    httpTimeout: 120s
    httpMaxIdleConnsPerHost: 32
BatchRouter:
  jobQueryBatchSize: 100000
  uploadFreq: 30s
  warehouseServiceMaxRetryTime: 3h
  noOfWorkers: 8
  maxFailedCountForJob: 128
  retryTimeWindow: 180m
Warehouse:
  mode: embedded
  webPort: 8082
  uploadFreq: 1800s
  noOfWorkers: 8
  noOfSlaveWorkerRoutines: 4
  mainLoopSleep: 5s
  minRetryAttempts: 3
  retryTimeWindow: 180m
  minUploadBackoff: 60s
  maxUploadBackoff: 1800s
  warehouseSyncPreFetchCount: 10
  warehouseSyncFreqIgnore: false
  stagingFilesBatchSize: 960
  enableIDResolution: false
  populateHistoricIdentities: false
  enableJitterForSyncs: false
  redshift:
    maxParallelLoads: 3
  snowflake:
    maxParallelLoads: 3
  bigquery:
    maxParallelLoads: 20
  postgres:
    maxParallelLoads: 3
    enableSQLStatementExecutionPlan: false
  mssql:
    maxParallelLoads: 3
  azure_synapse:
    maxParallelLoads: 3
  clickhouse:
    maxParallelLoads: 3
    queryDebugLogs: false
    blockSize: 1000
    poolSize: 10
    disableNullable: false
    enableArraySupport: false
  deltalake:
    loadTableStrategy: MERGE
  backfill:
    enabled: false
    maxDateRangeDays: 90
    maxConcurrentJobs: 3
    # Interval in seconds between backfill job status monitor checks
    monitorIntervalSeconds: 60
  healthMonitor:
    enabled: true
    collectionIntervalSeconds: 60
    retentionDays: 30
    alerting:
      # Fraction of failed syncs triggering a failure rate alert (0.0-1.0)
      failureRateThreshold: 0.1
      # Duration in milliseconds above which a sync is considered a latency spike
      durationSpikeThresholdMs: 300000
      # Percentage drop in row count (vs. historical average) triggering anomaly alert
      rowCountDropPercent: 50
      # Whether schema drift detection alerts are enabled
      schemaDriftEnabled: true
      # Minimum minutes between repeated alerts for the same source/dest pair
      cooldownMinutes: 30
  selectiveSync:
    enabled: false
    cacheRefreshMinutes: 5
  replay:
    enabled: false
    maxConcurrentReplays: 2
    batchSize: 1000
    timeoutMinutes: 60
Processor:
  webPort: 8086
  loopSleep: 10ms
  maxLoopSleep: 5000ms
  fixedLoopSleep: 0ms
  storeTimeout: 5m
  maxLoopProcessEvents: 10000
  transformBatchSize: 100
  userTransformBatchSize: 200
  maxHTTPConnections: 100
  maxHTTPIdleConnections: 50
  maxRetry: 30
  retrySleep: 100ms
  errReadLoopSleep: 30s
  errDBReadBatchSize: 1000
  noOfErrStashWorkers: 2
  maxFailedCountForErrJob: 3
  enableEventCount: true
  Stats:
    captureEventName: false
Dedup:
  enableDedup: false
  dedupWindow: 3600s
  memOptimized: true
BackendConfig:
  configFromFile: false
  configJSONPath: /etc/rudderstack/workspaceConfig.json
  pollInterval: 5s
  regulationsPollInterval: 300s
  maxRegulationsPerRequest: 1000
  Regulations:
    pageSize: 50
    pollInterval: 300s
Logger:
  enableConsole: true
  enableFile: false
  consoleJsonFormat: false
  fileJsonFormat: false
  logFileLocation: /tmp/rudder_log.log
  logFileSize: 100
  enableTimestamp: true
  enableFileNameInLog: true
  enableStackTrace: false
Diagnostics:
  enableDiagnostics: true
  gatewayTimePeriod: 60s
  routerTimePeriod: 60s
  batchRouterTimePeriod: 6l
  enableServerStartMetric: true
  enableConfigIdentifyMetric: true
  enableServerStartedMetric: true
  enableConfigProcessedMetric: true
  enableGatewayMetric: true
  enableRouterMetric: true
  enableBatchRouterMetric: true
  enableDestinationFailuresMetric: true
RuntimeStats:
  enabled: true
  statsCollectionInterval: 10
  enableCPUStats: true
  enableMemStats: true
  enableGCStats: true
PgNotifier:
  retriggerInterval: 2s
  retriggerCount: 500
  trackBatchInterval: 2s
  maxAttempt: 3
# ====================================================================
# Sprint 3-5: Destination Connector Expansion (E-010 to E-014)
# ====================================================================
StreamDestinations:
  # Default timeout for new stream destination producers
  defaultTimeout: 30s
  # Default retry count for failed deliveries
  defaultRetryCount: 3
  # Per-destination enable/disable toggles (all default disabled)
  azureEventHub:
    enabled: false
    timeout: 30s
    maxRetries: 3
    maxBatchSize: 500
  googleCloudFunctions:
    enabled: false
    timeout: 30s
    maxRetries: 3
  bingAds:
    enabled: false
    timeout: 30s
    maxRetries: 3
  criteo:
    enabled: false
    timeout: 30s
    maxRetries: 3
  theTradeDesk:
    enabled: false
    timeout: 30s
    maxRetries: 3
# ====================================================================
# Sprint 4-6: Transformation and Functions Framework (E-015 to E-019)
# ====================================================================
Functions:
  # Master toggle for Functions runtime (Source, Destination, Insert Functions)
  enabled: false
  runtime:
    # Maximum execution time per function invocation
    timeout: 30s
    # Memory limit per function execution in bytes (default 128MB)
    memoryLimit: 134217728
    # Maximum concurrent function executions
    maxConcurrency: 10
    # Sandbox mode for JavaScript execution (isolate, process)
    sandboxMode: isolate
  secrets:
    # Encryption key for per-function secrets storage (required when Functions.enabled=true)
    encryptionKey: ""
  api:
    # Enable Functions management REST API endpoints
    enabled: false
    # Maximum code size in bytes for uploaded functions (default 5MB)
    maxCodeSize: 5242880
  sourceFunctions:
    # Enable Source Functions webhook ingestion via onRequest handler
    enabled: false
    # Maximum request body size for source function webhooks in KB
    maxRequestSizeKB: 4000
  destinationFunctions:
    # Enable Destination Functions typed handler dispatch (onTrack, onIdentify, etc.)
    enabled: false
  insertFunctions:
    # Enable Insert Functions pre-destination transformation hooks
    enabled: false
# ====================================================================
# Sprint 5-7: Protocols and Tracking Plan Enforcement (E-020 to E-025)
# ====================================================================
Protocols:
  enforcement:
    # Default enforcement mode: Allow, Omit, or Block
    defaultMode: Allow
  anomalyDetection:
    # Enable anomaly detection for unexpected events/properties not in tracking plan
    enabled: false
    # Time window for tracking event/property frequency patterns
    timeWindow: 24h
    # Anomaly threshold — fraction of total events triggering anomaly (0.0-1.0)
    threshold: 0.05
    # Maximum number of tracked event types per source
    maxTrackedEvents: 10000
  forwardBlockedEvents:
    # Enable server-to-server forwarding of blocked events to alternative source
    enabled: false
    # Destination source write key for forwarded blocked events
    targetSourceWriteKey: ""
  api:
    # Enable Tracking Plan management REST API (CRUD, versioning, CSV import/export)
    enabled: false
  validation:
    # JSON Schema draft version for tracking plan validation
    schemaDraft: "draft-07"
    # Maximum schema size in bytes (default 1MB)
    maxSchemaSize: 1048576
  consent:
    # Integration mode: when true, consent decisions interact with Protocols enforcement
    protocolsIntegrationEnabled: false
# ====================================================================
# Sprint 6-8: Identity Resolution and Profiles (E-026 to E-030)
# ====================================================================
Identity:
  # Master toggle for real-time identity resolution service
  enabled: false
  graph:
    # Interval between identity graph persistence flushes to PostgreSQL
    persistenceInterval: 5s
    # Maximum depth for identity merge chain traversal
    maxMergeDepth: 100
    # Maximum number of identities per graph segment
    maxIdentitiesPerSegment: 100000
    # Interval between identity graph metrics refresh cycles (duration, e.g. 60s, 5m).
    # Controls how frequently graph size and merge-chain depth metrics are
    # recomputed and emitted to the stats backend.
    metricsRefreshInterval: 60s
  profiles:
    # Enable Redis-backed profile caching for sub-200ms API responses
    cacheEnabled: true
    # Profile cache TTL
    cacheTTL: 5m
    # Maximum response time target for Profiles API
    responseTimeout: 200ms
    # Maximum number of events returned per profile lookup
    maxEventsPerProfile: 1000
  redis:
    # Redis server address for identity graph caching
    address: "localhost:6379"
    # Redis database number
    db: 0
    # Redis connection pool size
    poolSize: 10
    # Redis connection password (empty for no auth)
    password: ""
  sync:
    # Enable profile sync to downstream destinations via change-data-capture
    enabled: false
    # Interval between profile sync cycles
    interval: 30s
    # Maximum batch size for profile sync
    batchSize: 100
    # Interval in milliseconds between internal flush cycles that persist
    # buffered profile change events to the sync outbox table (integer, ms).
    FlushIntervalMS: 1000
    # Maximum number of delivery retries for a single profile sync event
    # before it is moved to the dead-letter queue (integer).
    MaxRetries: 3
  resolution:
    # Blocked identifier values (regex patterns) to prevent merge-all scenarios
    blockedValues: []
    # Maximum number of external IDs per identity per week
    weeklyLimit: 0
    # Maximum number of external IDs per identity per month
    monthlyLimit: 0
    # Maximum number of external IDs per identity ever
    totalLimit: 0
    # Identifier type priority ranking (higher priority types override lower)
    priorityOrder:
      - user_id
      - email
      - phone
      - anonymous_id
    # Default limit applied when no explicit per-type limit is configured.
    # maxCount is the maximum number of new external IDs that may be linked
    # to a single identity within the specified timeWindow.
    defaultLimit:
      # Maximum count of new external IDs allowed per identity within
      # the configured time window (integer). Set to 0 to disable.
      maxCount: 5
      # Time window over which the maxCount limit is enforced.
      # Valid values: "weekly", "monthly", "annually", "ever".
      timeWindow: "monthly"
# ====================================================================
# Sprint 8-10: Operational Tooling and Monitoring (E-036 to E-039)
# ====================================================================
Monitoring:
  dashboard:
    # Enable per-destination delivery monitoring dashboard metrics
    enabled: false
    # Metrics refresh/aggregation interval
    refreshInterval: 10s
    # Retention period for dashboard metrics
    retentionPeriod: 24h
  alerting:
    # Enable configurable alerting rules engine
    enabled: false
    # Alert rule evaluation interval
    evaluationInterval: 30s
    # Default notification channels (webhook, email, slack)
    channels:
      - webhook
    # Default alerting thresholds
    thresholds:
      # Throughput drop percentage triggering alert
      throughputDropPercent: 50
      # Error rate percentage triggering alert
      errorRatePercent: 5
      # Delivery latency threshold in milliseconds
      deliveryLatencyMs: 30000
      # JobsDB queue depth triggering alert
      queueDepthThreshold: 100000
  profiling:
    # Enable per-stage pipeline performance profiling
    enabled: true
    # Sampling rate for performance profiling (1-100 integer, percentage of events sampled)
    sampleRate: 100
    # Target throughput for capacity planning reports (events per second)
    targetThroughput: 50000
    # Profiling data retention period
    retentionPeriod: 168h
  replay:
    # Enable dry-run mode for advanced replay operations
    dryRunEnabled: false
    # Maximum date range for replay filtering in days
    maxDateRangeDays: 90
    # Maximum concurrent advanced replay operations
    maxConcurrentReplays: 2
