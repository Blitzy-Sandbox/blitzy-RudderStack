  # ============================================================
  # Functions API Endpoints (Sprint 4-6, E-015, E-018)
  # ============================================================
  /v1/functions/source:
    post:
      tags:
        - Functions API
      summary: Source Functions Webhook
      description: >-
        Receives inbound webhook events and processes them through a configured
        Source Function's onRequest(request, settings) handler. The Source
        Function transforms the incoming webhook payload into one or more
        RudderStack events.
      operationId: SourceFunctionsWebhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary webhook payload from the third-party source.
