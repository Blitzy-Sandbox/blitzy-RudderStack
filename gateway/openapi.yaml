  # ============================================================
  # Protocols API Endpoints (Sprint 5-7, E-024)
  # ============================================================
  /v1/protocols/tracking-plans:
    get:
      tags:
        - Protocols API
      summary: List Tracking Plans
      description: >-
        Returns a paginated list of all tracking plans configured for the
        authenticated workspace. Each tracking plan contains a JSON Schema
        draft-07 definition and enforcement configuration.
      operationId: ListTrackingPlans
      parameters:
        - name: limit
          in: query
          description: Maximum number of tracking plans to return. Default is 50.
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of tracking plans to skip for pagination. Default is 0.
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response with list of tracking plans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trackingPlans:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackingPlan'
                  total:
                    type: integer
                    description: Total number of tracking plans.
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
      security:
        - bearerAuth: []
    post:
      tags:
        - Protocols API
      summary: Create Tracking Plan
      description: >-
        Creates a new tracking plan with a JSON Schema draft-07 definition and
        enforcement configuration. The enforcement config specifies per-source
        per-call-type behavior: Block Event, Omit Properties, or Allow.
      operationId: CreateTrackingPlan
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - schema
              properties:
                name:
                  type: string
                  description: Human-readable name for the tracking plan.
                schema:
                  type: object
                  description: >-
                    JSON Schema draft-07 definition for event validation
                    including required properties, types, patterns, and
                    nested object schemas.
                enforcementConfig:
                  type: object
                  description: >-
                    Per-source per-call-type enforcement mode configuration.
                    Keys are source IDs, values are objects mapping call types
                    (track, identify, group, page, screen) to enforcement
                    modes (block, omit, allow).
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                        - block
                        - omit
                        - allow
        required: true
      responses:
        '201':
          description: Tracking plan created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPlan'
        '400':
          description: StatusBadRequest
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid tracking plan definition"
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
      security:
        - bearerAuth: []
  /v1/protocols/tracking-plans/{trackingPlanId}:
    get:
      tags:
        - Protocols API
      summary: Get Tracking Plan
      description: >-
        Returns the details of a specific tracking plan by its unique
        identifier including the full JSON Schema definition, enforcement
        configuration, and version metadata.
      operationId: GetTrackingPlan
      parameters:
        - name: trackingPlanId
          in: path
          description: Unique identifier of the tracking plan.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response with tracking plan details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPlan'
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
        '404':
          description: StatusNotFound
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Tracking plan not found"
      security:
        - bearerAuth: []
    put:
      tags:
        - Protocols API
      summary: Update Tracking Plan
      description: >-
        Updates the schema, enforcement configuration, or metadata of an
        existing tracking plan. Creates a new version entry in the tracking
        plan version history with an optional changelog description.
      operationId: UpdateTrackingPlan
      parameters:
        - name: trackingPlanId
          in: path
          description: Unique identifier of the tracking plan.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Updated human-readable name for the tracking plan.
                schema:
                  type: object
                  description: Updated JSON Schema draft-07 definition.
                enforcementConfig:
                  type: object
                  description: Updated enforcement mode configuration.
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                        - block
                        - omit
                        - allow
                changelog:
                  type: string
                  description: Description of changes made in this version update.
        required: true
      responses:
        '200':
          description: Tracking plan updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPlan'
        '400':
          description: StatusBadRequest
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid tracking plan definition"
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
        '404':
          description: StatusNotFound
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Tracking plan not found"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Protocols API
      summary: Delete Tracking Plan
      description: >-
        Permanently deletes a tracking plan and all its version history.
        Sources referencing this tracking plan will no longer enforce its
        schema. This action cannot be undone.
      operationId: DeleteTrackingPlan
      parameters:
        - name: trackingPlanId
          in: path
          description: Unique identifier of the tracking plan.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tracking plan deleted successfully.
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
        '404':
          description: StatusNotFound
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Tracking plan not found"
      security:
        - bearerAuth: []
  /v1/protocols/tracking-plans/{trackingPlanId}/versions:
    get:
      tags:
        - Protocols API
