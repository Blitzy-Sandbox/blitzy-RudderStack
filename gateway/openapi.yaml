                        type: string
                        format: date-time
                        description: Timestamp when the profile was first created.
                      lastSeenAt:
                        type: string
                        format: date-time
                        description: Timestamp of the most recent event.
                      segmentId:
                        type: string
                        description: Identity graph segment identifier.
                      mergeCount:
                        type: integer
                        description: Number of identity merges performed.
                      sources:
                        type: array
                        description: List of source IDs that contributed events.
                        items:
                          type: string
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
        '404':
          description: StatusNotFound
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Profile not found"
      security:
        - bearerAuth: []
  # ============================================================
  # Replay API Endpoints (Sprint 8-10, E-038)
  # ============================================================
  /v1/replay/advanced:
    post:
      tags:
        - Replay API
      summary: Advanced Replay
      description: >-
        Replay events with advanced filtering capabilities including source-level,
        date-range, and destination-level filtering. Supports a dry-run mode
        that previews the replay scope without executing. Events are replayed
        through the full pipeline including transformation and routing.
      operationId: AdvancedReplay
      parameters:
        - name: X-Replay-Source-Filter
          in: header
          description: >-
            Source ID to filter replay events. Only events originally received
            from this source will be replayed.
          required: false
          schema:
            type: string
        - name: X-Replay-Start-Date
          in: header
          description: >-
            Start date for the replay time window. Events before this timestamp
            are excluded. ISO 8601 format.
          required: false
          schema:
            type: string
            format: date-time
        - name: X-Replay-End-Date
          in: header
          description: >-
            End date for the replay time window. Events after this timestamp
            are excluded. ISO 8601 format.
          required: false
          schema:
            type: string
            format: date-time
        - name: X-Replay-Destination-Filter
          in: header
          description: >-
            Destination ID to filter replay. Only replays events to the
            specified destination regardless of original routing.
          required: false
          schema:
            type: string
        - name: X-Replay-Dry-Run
          in: header
          description: >-
            When set to true, returns a preview of events that would be
            replayed without actually executing the replay. Useful for
            estimating replay scope and impact.
          required: false
          schema:
            type: boolean
            default: false
        - name: X-Warehouse-Replay
          in: header
          description: >-
            When set to true, tags the replay for warehouse-only routing.
            Events will only be delivered to warehouse destinations.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayAdvancedRequest'
        required: true
      responses:
        '200':
          description: StatusOK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "OK"
        '400':
          description: StatusBadRequest
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid request"
        '401':
          description: StatusUnauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid Authorization Header"
      security:
        - sourceIDAuth: []
  # ============================================================
  # Monitoring API Endpoints (Sprint 8-10, E-036)
  # ============================================================
  /v1/monitoring/dashboard:
    get:
      tags:
        - Monitoring API
      summary: Get Delivery Dashboard
      description: >-
        Returns per-destination event delivery metrics including success and
        failure counts, latency percentiles (p50, p95, p99), throughput rate,
        retry counts, and circuit breaker state. Metrics are aggregated over
        a configurable time window and can be filtered to a specific destination.
      operationId: GetDeliveryDashboard
      parameters:
        - name: destinationId
          in: query
          description: >-
            Filter metrics to a specific destination by its unique identifier.
            If omitted, returns metrics for all active destinations.
          required: false
          schema:
            type: string
        - name: window
          in: query
          description: >-
            Time window for metric aggregation. Valid values are 5m, 15m, 1h,
            6h, 24h. Default is 1h.
          required: false
          schema:
            type: string
            enum:
              - 5m
              - 15m
              - 1h
              - 6h
              - 24h
            default: 1h
      responses:
        '200':
          description: Successful response with delivery dashboard metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
      security:
        - bearerAuth: []
