        definitions.
      operationId: GetProfileTraits
      parameters:
        - name: profileId
          in: path
          description: Unique identifier of the profile.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response with profile traits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  traits:
                    type: object
                    description: Key-value map of all traits for this profile.
                    additionalProperties: true
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
        '404':
          description: StatusNotFound
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Profile not found"
