        - bearerAuth: []
  /v1/profiles/{profileId}/events:
    get:
      tags:
        - Profiles API
      summary: Get Profile Events
      description: >-
        Returns a paginated list of events associated with a specific profile
        across all merged identities. Events are returned in reverse
        chronological order.
      operationId: GetProfileEvents
      parameters:
        - name: profileId
          in: path
          description: Unique identifier of the profile.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of events to return. Default is 20.
          required: false
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: >-
            Opaque cursor string for pagination. Returned in the response as
            nextCursor when more events are available.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response with profile events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    description: List of events for this profile.
                    items:
                      type: object
                      description: Individual event record.
                      additionalProperties: true
                  nextCursor:
                    type: string
                    description: >-
                      Cursor for retrieving the next page of events. Null if
                      no more events are available.
                  hasMore:
                    type: boolean
                    description: Whether more events are available.
        '401':
