  /v1/webhook:
    post:
      tags:
        - HTTP API
      summary: Webhook
      description: >-
        The webhook endpoint accepts inbound webhook events from third-party
        sources. The writeKey can be passed in the Authorization header
        (Basic Auth) or as a query parameter. The source must have a webhook
        source category.
      operationId: WebhookPost
      parameters:
        - name: writeKey
          in: query
          description: >-
            Write Key for authentication. Alternative to passing the writeKey
            in the Authorization header via Basic Auth.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary webhook payload from the third-party source.
        required: true
      responses:
        '200':
          description: StatusOK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "OK"
        '400':
          description: StatusBadRequest
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid request"
        '401':
          description: StatusUnauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid Authorization Header"
        '404':
          description: StatusNotFound
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Source does not accept webhook events"
        '413':
          description: StatusRequestEntityTooLarge
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Request size too large"
        '429':
          description: StatusTooManyRequests
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Too many requests"
      security:
        - writeKeyAuth: []
    get:
      tags:
        - HTTP API
      summary: Webhook (GET)
      description: >-
        The webhook GET endpoint accepts inbound webhook verification requests
        from third-party sources that require GET-based handshake validation.
        The writeKey can be passed in the Authorization header (Basic Auth)
        or as a query parameter. The source must have a webhook source category.
      operationId: WebhookGet
      parameters:
        - name: writeKey
          in: query
          description: >-
            Write Key for authentication. Alternative to passing the writeKey
            in the Authorization header via Basic Auth.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: StatusOK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "OK"
        '400':
          description: StatusBadRequest
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid request"
        '401':
          description: StatusUnauthorized
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid Authorization Header"
        '404':
          description: StatusNotFound
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Source does not accept webhook events"
      security:
        - writeKeyAuth: []
  /beacon/v1/batch:
    post:
      tags:
        - HTTP API
      summary: Beacon Batch
      description: >-
        The beacon batch endpoint accepts batch event payloads sent via the
        browser navigator.sendBeacon() API used by the JavaScript SDK. The
        writeKey must be passed as a query parameter. Supports text/plain,
        application/x-www-form-urlencoded, and application/json content types
        as produced by sendBeacon().
      operationId: BeaconBatch
      parameters:
        - name: writeKey
          in: query
          description: Write Key for authentication (required).
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPayload'
          text/plain:
            schema:
              $ref: '#/components/schemas/BatchPayload'
        required: true
      responses:
        '200':
          description: StatusOK
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "OK"
        '400':
          description: StatusBadRequest
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid request"
        '401':
