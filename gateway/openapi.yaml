    # ===========================================================
    # Functions API Schemas (Sprint 4-6, E-018)
    # ===========================================================
    Function:
      type: object
      description: >-
        Represents a configured function in the RudderStack pipeline.
        Functions can be Source Functions (process inbound webhooks),
        Destination Functions (process outbound events with typed handlers),
        or Insert Functions (pre-destination transformation hooks).
      properties:
        id:
          type: string
          description: Unique identifier for the function.
        workspaceId:
          type: string
          description: Workspace to which this function belongs.
        name:
          type: string
          description: Human-readable name for the function.
        type:
          type: string
          description: >-
            Type of function determining its invocation point in the pipeline.
          enum:
            - source
            - destination
            - insert
        code:
          type: string
          description: >-
            JavaScript source code of the function. Source functions must
            export an onRequest handler. Destination functions may export
            onTrack, onIdentify, onGroup, onPage, onScreen, onAlias,
            onDelete, and onBatch handlers. Insert functions export a
            handler that receives and returns transformed events.
        version:
          type: integer
          description: Current version number of the function code.
        settings:
          type: object
          description: >-
            Key-value configuration settings passed to the function at
            runtime. These are available as the settings parameter in
            handler functions.
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the function was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the function was last updated.
      required:
        - id
        - workspaceId
        - name
        - type
        - code
        - version
    FunctionCreateRequest:
      type: object
      description: Request payload for creating or updating a function.
      properties:
        name:
          type: string
          description: Human-readable name for the function.
        type:
          type: string
          description: Type of function (source, destination, or insert).
          enum:
            - source
            - destination
            - insert
        code:
          type: string
          description: JavaScript source code of the function.
        settings:
          type: object
          description: >-
            Key-value configuration settings for the function runtime.
          additionalProperties:
            type: string
      required:
        - name
        - type
        - code
    FunctionTestRequest:
      type: object
      description: >-
        Request payload for testing a function with a sample event or
        webhook payload.
      properties:
        payload:
          type: object
          description: >-
            Test payload to pass to the function. For source functions this
            represents the inbound webhook request. For destination and
            insert functions this represents an event object.
          additionalProperties: true
        settings:
          type: object
          description: >-
            Optional settings overrides for the test invocation. If omitted
            the function's stored settings are used.
          additionalProperties:
            type: string
      required:
        - payload
    FunctionTestResponse:
      type: object
      description: >-
        Response from a function test invocation containing the transformed
        output, execution logs, and any errors encountered.
      properties:
        output:
          type: object
          description: >-
            The transformed output produced by the function. For source
            functions this is one or more RudderStack events. For destination
            functions this is the destination API payload. For insert
            functions this is the modified event.
          additionalProperties: true
        logs:
          type: array
          description: >-
            Console log output captured during function execution. Contains
            all messages written via console.log, console.info, etc.
          items:
            type: string
        errors:
          type: array
          description: >-
            Error messages captured during function execution. Includes
            typed errors such as EventNotSupported, InvalidEventPayload,
            ValidationError, RetryError, and DropEvent.
          items:
            type: string
        durationMs:
          type: number
          description: Execution duration in milliseconds.
    FunctionsList:
      type: object
      description: Paginated list of functions.
      properties:
        functions:
          type: array
          description: Array of function objects.
          items:
            $ref: '#/components/schemas/Function'
        total:
          type: integer
          description: Total number of functions matching the filter criteria.
        limit:
          type: integer
          description: Maximum number of functions returned per page.
        offset:
          type: integer
          description: Number of functions skipped for pagination.
    # ===========================================================
    # Protocols API Schemas (Sprint 5-7, E-024)
    # ===========================================================
    TrackingPlan:
      type: object
      description: >-
        A tracking plan defines the expected event schema for sources
        connected to a workspace. It uses JSON Schema draft-07 for
        validation and supports configurable enforcement modes (Block,
        Omit, Allow) per source per call type.
      properties:
        id:
          type: string
          description: Unique identifier for the tracking plan.
        workspaceId:
          type: string
          description: Workspace to which this tracking plan belongs.
        name:
          type: string
          description: Human-readable name for the tracking plan.
        schema:
          type: object
          description: >-
            JSON Schema draft-07 definition for event validation. Supports
            required properties, regex patterns, nested object schemas,
            enum values, and full type enforcement including any, array,
            object, boolean, integer, number, string, null, and date-time.
          additionalProperties: true
        version:
          type: integer
          description: Current version number of the tracking plan schema.
        enforcementConfig:
          type: object
          description: >-
            Per-source per-call-type enforcement mode configuration. Each
            key is a source ID mapping to an object where keys are call
            types (track, identify, group, page, screen) and values are
            enforcement modes.
          additionalProperties:
            type: object
            description: >-
              Call-type to enforcement-mode mapping for a specific source.
            additionalProperties:
              type: string
              description: >-
                Enforcement mode: block (reject the entire event), omit
                (strip non-conforming properties but allow the event), or
                allow (pass the event through with violations reported).
              enum:
                - block
                - omit
                - allow
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the tracking plan was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the tracking plan was last updated.
      required:
        - id
        - workspaceId
        - name
        - schema
        - version
    TrackingPlanVersion:
      type: object
      description: >-
        Represents a historical version of a tracking plan schema. Each
        update to a tracking plan creates a new version entry preserving
        the full schema snapshot and changelog.
      properties:
        id:
          type: string
          description: Unique identifier for this version entry.
        trackingPlanId:
          type: string
          description: Identifier of the parent tracking plan.
        version:
          type: integer
          description: Sequential version number.
        schema:
          type: object
          description: >-
            Full JSON Schema draft-07 definition snapshot at this version.
          additionalProperties: true
        changelog:
          type: string
          description: >-
            Human-readable description of changes made in this version.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this version was created.
      required:
        - id
        - trackingPlanId
        - version
        - schema
    # ===========================================================
    # Profiles API Schemas (Sprint 6-8, E-027)
    # ===========================================================
    Profile:
      type: object
      description: >-
        A unified user profile resolved from the real-time identity graph.
        Contains traits collected from identify calls, event history,
        external identifiers across 12+ types, and profile metadata.
      properties:
        profileId:
          type: string
          description: >-
            Canonical profile identifier in the identity graph.
        traits:
          type: object
          description: >-
            Key-value map of all traits associated with this profile
            including properties from identify calls and computed traits.
          additionalProperties: true
        events:
          type: array
          description: >-
            Recent event history associated with this profile across all
            merged identities.
          items:
            type: object
            description: Individual event record with full payload.
            additionalProperties: true
        externalIds:
          type: array
          description: >-
            All external identifiers associated with this profile spanning
            12+ identifier types including user_id, email, anonymous_id,
            phone, ios.id, android.id, ios.idfa, android.aaid,
            ga_client_id, amp_device_id, cross_domain_id, and custom
            identifiers.
          items:
            $ref: '#/components/schemas/ExternalId'
        metadata:
          type: object
          description: >-
            Profile metadata including creation time, last activity, merge
            history, and source attribution.
          properties:
            createdAt:
              type: string
              format: date-time
              description: Timestamp when the profile was first created.
            lastSeenAt:
              type: string
              format: date-time
              description: Timestamp of the most recent activity.
            segmentId:
              type: string
              description: Identity graph segment identifier.
            mergeCount:
              type: integer
              description: Number of identity merges performed.
            sources:
              type: array
              description: Source IDs that contributed data to this profile.
              items:
                type: string
      required:
        - profileId
    ExternalId:
      type: object
      description: >-
        An external identifier associated with a profile. Represents a
        single identity claim from a specific source such as user_id,
        email, anonymous_id, phone, or device identifiers.
      properties:
        type:
          type: string
          description: >-
            The identifier type. Standard types include user_id, email,
            anonymous_id, phone, ios.id, android.id, ios.idfa,
            android.aaid, ga_client_id, amp_device_id, cross_domain_id.
            Custom identifier types are also supported.
        value:
          type: string
          description: The identifier value.
        createdSource:
          type: string
          description: >-
            Source ID from which this external identifier was first
            observed.
        createdAt:
          type: string
          format: date-time
          description: >-
            Timestamp when this external identifier was first associated
            with the profile.
      required:
        - type
        - value
    # ===========================================================
    # Monitoring API Schemas (Sprint 8-10, E-036)
    # ===========================================================
    DashboardResponse:
      type: object
      description: >-
        Aggregated delivery metrics dashboard response containing per-
        destination metrics and a collection timestamp.
      properties:
        destinations:
          type: array
          description: >-
            Array of per-destination delivery metrics. Each entry contains
            success/failure counts, latency percentiles, throughput, and
            operational state.
          items:
            $ref: '#/components/schemas/DestinationMetrics'
        timestamp:
          type: string
          format: date-time
          description: >-
            Timestamp when these metrics were last computed.
        window:
          type: string
          description: >-
            Time window over which metrics were aggregated.
      required:
        - destinations
        - timestamp
    DestinationMetrics:
      type: object
      description: >-
        Delivery metrics for a single destination including delivery
        success and failure rates, latency distribution, throughput, and
        circuit breaker state.
      properties:
        destinationId:
          type: string
          description: Unique identifier of the destination.
        destinationType:
          type: string
          description: >-
            Type of the destination (e.g., webhook, S3, BigQuery, Kafka).
        successCount:
          type: integer
          description: >-
            Number of events successfully delivered in the time window.
        failureCount:
          type: integer
          description: >-
            Number of events that failed delivery in the time window.
        latencyP50Ms:
          type: number
          description: >-
            50th percentile (median) delivery latency in milliseconds.
        latencyP95Ms:
          type: number
          description: >-
            95th percentile delivery latency in milliseconds.
        latencyP99Ms:
          type: number
          description: >-
            99th percentile delivery latency in milliseconds.
        throughputPerSec:
          type: number
          description: >-
            Average events delivered per second in the time window.
        retryCount:
          type: integer
          description: >-
            Number of delivery retries attempted in the time window.
        circuitBreakerState:
          type: string
          description: >-
            Current state of the destination circuit breaker for delivery
            protection.
          enum:
            - closed
            - half-open
            - open
        lastUpdated:
          type: string
          format: date-time
          description: >-
            Timestamp when metrics for this destination were last updated.
      required:
        - destinationId
        - destinationType
        - successCount
        - failureCount
    # ===========================================================
    # Replay API Schemas (Sprint 8-10, E-038)
    # ===========================================================
    ReplayAdvancedRequest:
      type: object
      description: >-
        Request payload for advanced replay with filtering capabilities.
        Extends the standard batch payload with source-level, date-range,
        and destination-level filter parameters plus dry-run support.
      allOf:
        - $ref: '#/components/schemas/BatchPayload'
        - type: object
          properties:
            sourceFilter:
              type: string
              description: >-
                Source ID to filter replay events. Only events from this
                source are replayed.
            startDate:
              type: string
              format: date-time
              description: >-
                Start of the replay time window. Events before this
                timestamp are excluded. ISO 8601 format.
            endDate:
              type: string
              format: date-time
              description: >-
                End of the replay time window. Events after this timestamp
                are excluded. ISO 8601 format.
            destinationFilter:
              type: string
              description: >-
                Destination ID to route replayed events to. Overrides
                original event routing.
            dryRun:
              type: boolean
              description: >-
                When true, returns a preview of the replay scope without
                executing. Default is false.
              default: false
