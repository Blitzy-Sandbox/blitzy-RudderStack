        - bearerAuth: []
  /v1/protocols/tracking-plans/{trackingPlanId}/export:
    get:
      tags:
        - Protocols API
      summary: Export Tracking Plan as CSV
      description: >-
        Exports a tracking plan as a CSV file containing event names, property
        definitions, types, required status, and descriptions. Useful for
        sharing tracking plan specifications with non-technical stakeholders.
      operationId: ExportTrackingPlan
      parameters:
