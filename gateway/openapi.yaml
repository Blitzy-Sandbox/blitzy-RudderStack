  /v1/import:
    post:
      tags:
        - HTTP API
      summary: Import
      description: >-
        The import call lets you send historical data to RudderStack. It accepts
        the same event types as the standard endpoints but is optimized for
        high-volume historical data import with server-side timestamps.
      operationId: Import
      requestBody:
        content:
          application/json:
            schema:
