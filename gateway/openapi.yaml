  /v1/profiles/{profileId}:
    get:
      tags:
        - Profiles API
      summary: Get Profile
      description: >-
        Returns the unified profile for a given profile identifier including
        traits, events, external identifiers, and metadata. The include query
        parameter controls which sections are returned. Designed for sub-200ms
        response times with Redis-backed caching.
      operationId: GetProfile
      parameters:
        - name: profileId
          in: path
          description: >-
            Unique identifier of the profile in the identity graph. Can be a
            canonical user ID or any resolved external identifier.
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: >-
            Comma-separated list of profile sections to include in the response.
            Valid values are traits, events, external_ids, and metadata. If
            omitted, all sections are returned.
          required: false
          schema:
            type: string
            example: "traits,events,external_ids,metadata"
      responses:
        '200':
          description: Successful response with unified profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: StatusUnauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authentication token"
        '404':
          description: StatusNotFound
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Profile not found"
      security:
        - bearerAuth: []
