            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Invalid Authorization Header"
        '404':
          description: StatusNotFound
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Source does not accept webhook events"
        '413':
          description: StatusRequestEntityTooLarge
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Request size too large"
        '429':
          description: StatusTooManyRequests
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "Too many requests"
  /pixel/v1/track:
    get:
      tags:
        - HTTP API
      summary: Pixel Track
      description: >-
        The pixel track endpoint accepts track events via GET requests with
        query parameters. Used for web SDK image tag tracking scenarios such
        as email open tracking. Always returns a 1x1 transparent GIF image
        regardless of processing result. The writeKey and event properties
        are passed as query parameters.
      operationId: PixelTrack
      parameters:
        - name: writeKey
          in: query
          description: Write Key for authentication (required).
          required: true
          schema:
            type: string
        - name: event
          in: query
          description: Name of the event being tracked (required for track calls).
          required: true
          schema:
            type: string
        - name: anonymousId
          in: query
          description: Anonymous identifier for the user.
          required: false
          schema:
            type: string
        - name: userId
          in: query
          description: Unique identifier for the user.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Returns a 1x1 transparent GIF image.
          content:
            image/gif:
              schema:
                type: string
                format: binary
      security: []
  /pixel/v1/page:
    get:
      tags:
        - HTTP API
      summary: Pixel Page
      description: >-
        The pixel page endpoint accepts page events via GET requests with
        query parameters. Used for web SDK image tag tracking scenarios such
        as page view tracking via image tags. Always returns a 1x1 transparent
        GIF image regardless of processing result. The writeKey and page
        properties are passed as query parameters.
      operationId: PixelPage
      parameters:
        - name: writeKey
          in: query
          description: Write Key for authentication (required).
          required: true
          schema:
            type: string
        - name: name
          in: query
          description: Name of the page being viewed.
          required: false
          schema:
            type: string
        - name: anonymousId
          in: query
          description: Anonymous identifier for the user.
          required: false
          schema:
            type: string
        - name: userId
          in: query
          description: Unique identifier for the user.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Returns a 1x1 transparent GIF image.
          content:
            image/gif:
              schema:
                type: string
                format: binary
      security: []
  /internal/v1/extract:
    post:
      tags:
