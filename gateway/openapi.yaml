  /v1/protocols/tracking-plans/import:
    post:
      tags:
        - Protocols API
      summary: Import Tracking Plan from CSV
      description: >-
        Imports a tracking plan from a CSV file. The CSV must contain columns
        for event name, property name, property type, required status, and
        description. Creates a new tracking plan or updates an existing one
        based on the provided name.
      operationId: ImportTrackingPlan
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
